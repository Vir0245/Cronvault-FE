name: CronVault FE — Frontend ECR Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Vir0245/Cronvault-FE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cronvault-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy docker-compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          source: "docker-compose.frontend.yml"
          target: "~/cronvault-frontend/"

      - name: Pull and Restart Frontend Containers
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ap-south-1
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          timeout: 30s
          command_timeout: 10m
          envs: ECR_REGISTRY,AWS_REGION
          script: |
            cd ~/cronvault-frontend || exit 1
            
            # Authenticate the EC2 instance with ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # Pull the new image and recreate the container
            docker compose -f docker-compose.frontend.yml pull
            docker compose -f docker-compose.frontend.yml down
            docker compose -f docker-compose.frontend.yml up -d

      - name: Verify HTTPS
        run: curl -sf -o /dev/null -w '%{http_code}\n' https://cronvault.duckdns.org/
