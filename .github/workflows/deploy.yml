name: CronVault FE — Deploy with Backup

on:
  push:
    branches: [main]
    # Optional: only run when frontend files change
    # paths:
    #   - '**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      HOST: ubuntu@${{ secrets.FE_PUBLIC_IP }}
      REMOTE_PATH: ~/cronvault-frontend

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: Vir0245/Cronvault-FE

      - name: Setup SSH key
        env:
          KEY: ${{ secrets.SSH_KEY_PEM }}
        run: |
          echo "$KEY" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.FE_PUBLIC_IP }} >> ~/.ssh/known_hosts

      - name: Open SSH in Security Group
        run: |
          MY_IP=$(curl -s https://checkip.amazonaws.com)
          echo "MY_IP=$MY_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --region $AWS_REGION \
            --group-id ${{ secrets.FE_SG }} \
            --protocol tcp --port 22 --cidr "$MY_IP/32" || true

      - name: Backup current frontend
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_PATH="${REMOTE_PATH}.backup.${TIMESTAMP}"
          echo "BACKUP_PATH=$BACKUP_PATH" >> $GITHUB_ENV

          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no $HOST \
            "cp -r $REMOTE_PATH $BACKUP_PATH || echo 'No existing folder to backup'"

      - name: Ensure target directory exists
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no $HOST \
            "mkdir -p $REMOTE_PATH"

      - name: Deploy all frontend files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          source: "./*"
          target: "${{ env.REMOTE_PATH }}/"
          strip_components: 0

      - name: Verify deployment
        run: |
          sleep 2
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' https://cronvault.duckdns.org/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Deployment verification failed!"
            exit 1
          fi

      - name: Cleanup old backups (keep last 5)
        if: always()
        run: |
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no $HOST \
            "ls -td ${REMOTE_PATH}.backup.* 2>/dev/null | tail -n +6 | xargs -r rm -rf || true"

      - name: Close SSH in Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --region $AWS_REGION \
            --group-id ${{ secrets.FE_SG }} \
            --protocol tcp --port 22 --cidr "${{ env.MY_IP }}/32" || true
