name: CronVault FE — Frontend Only (from Vir0245/Cronvault-FE)

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      FE_PUBLIC_IP: ${{ secrets.FE_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Vir0245/Cronvault-FE

      - name: Backup current dashboard
        env:
          KEY: ${{ secrets.SSH_KEY_PEM }}
        run: |
          echo "$KEY" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@${{ secrets.FE_PUBLIC_IP }} "cp ~/cronvault-frontend/dashboard.html ~/cronvault-frontend/dashboard.html.bak || true"

      - name: Ensure target directory exists
        run: ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ubuntu@${{ secrets.FE_PUBLIC_IP }} "mkdir -p ~/cronvault-frontend" || true
        env:
          KEY: ${{ secrets.SSH_KEY_PEM }}

      - name: Deploy dashboard-redesigned.html
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          source: "dashboard-redesigned.html"
          target: "~/cronvault-frontend/"
          
      - name: Rebuild and Restart Frontend Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FE_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_PEM }}
          timeout: 30s
          command_timeout: 10m
          script: |
            cd ~/cronvault-frontend || exit 1
            docker compose down
            docker compose build --no-cache
            docker compose up -d

      - name: Verify HTTPS
        run: curl -sf -o /dev/null -w '%{http_code}\n' https://cronvault.duckdns.org/
